<section class="habiba-promise" aria-labelledby="habiba-promise-title">
  <div class="habiba-promise__inner">
    <!-- Content -->
    <div class="habiba-promise__content">
      <p class="habiba-promise__eyebrow">
        {{ 'home.promise.eyebrow' | translate }}
      </p>
      <h2 id="habiba-promise-title" class="habiba-promise__title">
        {{ 'home.promise.title' | translate }}
      </h2>
      <p class="habiba-promise__text">
        {{ 'home.promise.text' | translate }}
      </p>
      <a routerLink="/about" class="habiba-promise__cta">
        <span>{{ 'home.promise.cta' | translate }}</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>

    <!-- Image -->
    <div class="habiba-promise__media">
<img
  [src]="image"
  alt="Habiba Store — Crafting memories, one gift at a time"
  loading="lazy"
  decoding="async"
  class="habiba-promise__image img-fallback"
/>

      <!-- Happy customers badge -->
      <div class="habiba-promise__badge" aria-label="10k+ happy customers">
        <p class="habiba-promise__badge-value">10k+</p>
        <p class="habiba-promise__badge-label">
          {{ 'home.promise.happyCustomers' | translate }}
        </p>
      </div>
    </div>
  </div>
</section>
